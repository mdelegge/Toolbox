<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@11.0.0/marked.min.js"></script>
    <style>
        /* Theme Variables */
        :root {
            /* Light theme (default) */
            --bg-primary: #f9fafb;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f3f4f6;
            --border-color: #e5e7eb;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --text-tertiary: #9ca3af;
            --resize-handle: #cbd5e1;
            --resize-handle-hover: #64748b;
            --drop-zone-bg: #dbeafe;
            --drop-zone-border: #3b82f6;
            
            /* Markdown preview colors */
            --md-text: #24292e;
            --md-heading-border: #eaecef;
            --md-code-bg: rgba(27, 31, 35, 0.05);
            --md-pre-bg: #f6f8fa;
            --md-blockquote-border: #dfe2e5;
            --md-blockquote-text: #6a737d;
            --md-table-border: #dfe2e5;
            --md-table-row-border: #c6cbd1;
            --md-table-header-bg: #f6f8fa;
            --md-table-bg: #fff;
            --md-link: #0366d6;
            --md-hr: #e1e4e8;
        }
        
        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --border-color: #475569;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-tertiary: #94a3b8;
            --resize-handle: #475569;
            --resize-handle-hover: #64748b;
            --drop-zone-bg: #1e3a5f;
            --drop-zone-border: #3b82f6;
            
            /* Markdown preview colors - dark */
            --md-text: #e2e8f0;
            --md-heading-border: #475569;
            --md-code-bg: rgba(255, 255, 255, 0.1);
            --md-pre-bg: #1e293b;
            --md-blockquote-border: #475569;
            --md-blockquote-text: #94a3b8;
            --md-table-border: #475569;
            --md-table-row-border: #475569;
            --md-table-header-bg: #334155;
            --md-table-bg: #1e293b;
            --md-link: #60a5fa;
            --md-hr: #475569;
        }
        
        body {
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        .resize-handle {
            cursor: ew-resize;
            background: linear-gradient(to right, transparent 45%, var(--resize-handle) 45%, var(--resize-handle) 55%, transparent 55%);
            transition: background 0.2s ease;
        }
        
        .resize-handle:hover {
            background: linear-gradient(to right, transparent 40%, var(--resize-handle-hover) 40%, var(--resize-handle-hover) 60%, transparent 60%);
        }
        
        .drop-zone {
            transition: all 0.3s ease;
        }
        
        .drop-zone.drag-over {
            background-color: var(--drop-zone-bg);
            border-color: var(--drop-zone-border);
        }
        
        /* Markdown preview styling */
        .markdown-preview {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: var(--md-text);
        }
        
        .markdown-preview h1 {
            font-size: 2em;
            font-weight: 600;
            margin-top: 24px;
            margin-bottom: 16px;
            padding-bottom: 0.3em;
            border-bottom: 1px solid var(--md-heading-border);
        }
        
        .markdown-preview h2 {
            font-size: 1.5em;
            font-weight: 600;
            margin-top: 24px;
            margin-bottom: 16px;
            padding-bottom: 0.3em;
            border-bottom: 1px solid var(--md-heading-border);
        }
        
        .markdown-preview h3 {
            font-size: 1.25em;
            font-weight: 600;
            margin-top: 24px;
            margin-bottom: 16px;
        }
        
        .markdown-preview h4 {
            font-size: 1em;
            font-weight: 600;
            margin-top: 24px;
            margin-bottom: 16px;
        }
        
        .markdown-preview p {
            margin-top: 0;
            margin-bottom: 16px;
        }
        
        .markdown-preview ul, .markdown-preview ol {
            margin-top: 0;
            margin-bottom: 16px;
            padding-left: 2em;
        }
        
        .markdown-preview code {
            background-color: var(--md-code-bg);
            border-radius: 3px;
            font-size: 85%;
            margin: 0;
            padding: 0.2em 0.4em;
            font-family: 'Courier New', Courier, monospace;
        }
        
        .markdown-preview pre {
            background-color: var(--md-pre-bg);
            border-radius: 6px;
            font-size: 85%;
            line-height: 1.45;
            overflow: auto;
            padding: 16px;
            margin-bottom: 16px;
        }
        
        .markdown-preview pre code {
            background-color: transparent;
            border: 0;
            display: inline;
            line-height: inherit;
            margin: 0;
            overflow: visible;
            padding: 0;
            word-wrap: normal;
        }
        
        .markdown-preview blockquote {
            border-left: 0.25em solid var(--md-blockquote-border);
            color: var(--md-blockquote-text);
            padding: 0 1em;
            margin: 0 0 16px 0;
        }
        
        .markdown-preview table {
            border-collapse: collapse;
            border-spacing: 0;
            margin-bottom: 16px;
            width: 100%;
        }
        
        .markdown-preview table tr {
            background-color: var(--md-table-bg);
            border-top: 1px solid var(--md-table-row-border);
        }
        
        .markdown-preview table th,
        .markdown-preview table td {
            border: 1px solid var(--md-table-border);
            padding: 6px 13px;
        }
        
        .markdown-preview table th {
            font-weight: 600;
            background-color: var(--md-table-header-bg);
        }
        
        .markdown-preview img {
            max-width: 100%;
            box-sizing: content-box;
        }
        
        .markdown-preview a {
            color: var(--md-link);
            text-decoration: none;
        }
        
        .markdown-preview a:hover {
            text-decoration: underline;
        }
        
        .markdown-preview hr {
            height: 0.25em;
            padding: 0;
            margin: 24px 0;
            background-color: var(--md-hr);
            border: 0;
        }
    </style>
</head>
<body class="h-screen flex flex-col" style="background-color: var(--bg-primary); color: var(--text-primary);">
    <!-- Header -->
    <header class="shadow-sm" style="background-color: var(--bg-secondary); border-bottom: 1px solid var(--border-color);">
        <div class="max-w-full mx-auto px-4 py-3 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <button onclick="goBack()" class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                        </svg>
                        Back
                    </button>
                    <h1 class="text-xl sm:text-2xl font-bold" style="color: var(--text-primary);">Markdown Viewer</h1>
                </div>
                <div class="flex items-center gap-2 sm:gap-3">
                    <select id="themeSelector" class="px-3 py-2 text-sm font-medium rounded-lg border focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors" style="background-color: var(--bg-secondary); color: var(--text-primary); border-color: var(--border-color);">
                        <option value="light">☀️ Light</option>
                        <option value="dark">🌙 Dark</option>
                    </select>
                    <button onclick="copyToClipboard()" class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                        </svg>
                        <span class="hidden sm:inline">Copy</span>
                    </button>
                    <button onclick="exportToFile()" class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-white bg-green-600 rounded-lg hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                        </svg>
                        <span class="hidden sm:inline">Export</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-hidden">
        <div id="container" class="flex h-full">
            <!-- Editor Panel -->
            <div id="editorPanel" class="flex flex-col" style="width: 50%; background-color: var(--bg-secondary); border-right: 1px solid var(--border-color);">
                <div class="px-4 py-3" style="background-color: var(--bg-tertiary); border-bottom: 1px solid var(--border-color);">
                    <div class="flex items-center justify-between">
                        <h2 class="text-sm font-semibold" style="color: var(--text-primary);">Markdown Input</h2>
                        <span class="text-xs" style="color: var(--text-secondary);">Drop .md file here</span>
                    </div>
                </div>
                <textarea 
                    id="markdownInput" 
                    class="flex-1 p-4 font-mono text-sm focus:outline-none resize-none drop-zone"
                    style="background-color: var(--bg-secondary); color: var(--text-primary);"
                    placeholder="# Start typing your markdown here...

## Features
- Write markdown on the left
- See live preview on the right
- Drag & drop .md files to load them
- Export to rich text file
- Copy formatted content to clipboard

Try editing this text!"
                ></textarea>
            </div>

            <!-- Resize Handle -->
            <div id="resizeHandle" class="w-2 cursor-ew-resize resize-handle hover:w-3 transition-all"></div>

            <!-- Preview Panel -->
            <div class="flex-1 flex flex-col overflow-hidden" style="background-color: var(--bg-secondary);">
                <div class="px-4 py-3" style="background-color: var(--bg-tertiary); border-bottom: 1px solid var(--border-color);">
                    <h2 class="text-sm font-semibold" style="color: var(--text-primary);">Preview</h2>
                </div>
                <div id="preview" class="flex-1 p-4 overflow-auto markdown-preview">
                    <!-- Preview content will be rendered here -->
                </div>
            </div>
        </div>
    </main>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-4 right-4 px-4 py-3 bg-gray-900 text-white rounded-lg shadow-lg transform transition-all duration-300 translate-y-20 opacity-0">
        <span id="toastMessage"></span>
    </div>

    <script>
        // Theme Management
        const themes = {
            light: { name: 'Light', icon: '☀️' },
            dark: { name: 'Dark', icon: '🌙' }
            // Add new themes here in the future, e.g.:
            // solarized: { name: 'Solarized', icon: '🌅' },
            // monokai: { name: 'Monokai', icon: '🎨' }
        };
        
        const themeSelector = document.getElementById('themeSelector');
        
        // Load saved theme or default to light
        const savedTheme = localStorage.getItem('markdown-viewer-theme') || 'light';
        applyTheme(savedTheme);
        
        function applyTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
            themeSelector.value = themeName;
            localStorage.setItem('markdown-viewer-theme', themeName);
        }
        
        themeSelector.addEventListener('change', (e) => {
            applyTheme(e.target.value);
        });
        
        // Initialize marked with options
        marked.setOptions({
            breaks: true,
            gfm: true,
            headerIds: true,
            mangle: false
        });

        const markdownInput = document.getElementById('markdownInput');
        const preview = document.getElementById('preview');
        const resizeHandle = document.getElementById('resizeHandle');
        const editorPanel = document.getElementById('editorPanel');
        const container = document.getElementById('container');

        // Load initial placeholder content
        updatePreview();

        // Update preview when typing
        markdownInput.addEventListener('input', updatePreview);

        function updatePreview() {
            const markdown = markdownInput.value || markdownInput.placeholder;
            preview.innerHTML = marked.parse(markdown);
        }

        // Resizable panels
        let isResizing = false;
        let startX = 0;
        let startWidth = 0;

        resizeHandle.addEventListener('mousedown', (e) => {
            isResizing = true;
            startX = e.clientX;
            startWidth = editorPanel.offsetWidth;
            document.body.style.cursor = 'ew-resize';
            document.body.style.userSelect = 'none';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            
            const delta = e.clientX - startX;
            const containerWidth = container.offsetWidth;
            const newWidth = startWidth + delta;
            const percentage = (newWidth / containerWidth) * 100;
            
            // Constrain between 20% and 80%
            if (percentage >= 20 && percentage <= 80) {
                editorPanel.style.width = percentage + '%';
            }
        });

        document.addEventListener('mouseup', () => {
            if (isResizing) {
                isResizing = false;
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
            }
        });

        // Drag and drop functionality
        let dragCounter = 0;

        markdownInput.addEventListener('dragenter', (e) => {
            e.preventDefault();
            dragCounter++;
            markdownInput.classList.add('drag-over');
        });

        markdownInput.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dragCounter--;
            if (dragCounter === 0) {
                markdownInput.classList.remove('drag-over');
            }
        });

        markdownInput.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        markdownInput.addEventListener('drop', (e) => {
            e.preventDefault();
            dragCounter = 0;
            markdownInput.classList.remove('drag-over');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                const file = files[0];
                
                // Check if it's a markdown file
                if (file.name.endsWith('.md') || file.name.endsWith('.markdown') || file.type === 'text/markdown') {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        markdownInput.value = event.target.result;
                        updatePreview();
                        showToast('File loaded successfully!');
                    };
                    reader.readAsText(file);
                } else {
                    showToast('Please drop a markdown (.md) file', 'error');
                }
            }
        });

        // Copy to clipboard
        async function copyToClipboard() {
            const html = preview.innerHTML;
            const text = preview.innerText;
            
            try {
                // Create a ClipboardItem with both HTML and plain text
                const blob = new Blob([html], { type: 'text/html' });
                const textBlob = new Blob([text], { type: 'text/plain' });
                
                await navigator.clipboard.write([
                    new ClipboardItem({
                        'text/html': blob,
                        'text/plain': textBlob
                    })
                ]);
                
                showToast('Copied to clipboard!');
            } catch (err) {
                // Fallback to plain text copy
                try {
                    await navigator.clipboard.writeText(text);
                    showToast('Copied as plain text');
                } catch (fallbackErr) {
                    showToast('Failed to copy', 'error');
                    console.error('Copy failed:', fallbackErr);
                }
            }
        }

        // Export to file
        function exportToFile() {
            const html = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Export</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #24292e;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            font-size: 2em;
            font-weight: 600;
            margin-top: 24px;
            margin-bottom: 16px;
            padding-bottom: 0.3em;
            border-bottom: 1px solid #eaecef;
        }
        h2 {
            font-size: 1.5em;
            font-weight: 600;
            margin-top: 24px;
            margin-bottom: 16px;
            padding-bottom: 0.3em;
            border-bottom: 1px solid #eaecef;
        }
        h3 {
            font-size: 1.25em;
            font-weight: 600;
            margin-top: 24px;
            margin-bottom: 16px;
        }
        p {
            margin-top: 0;
            margin-bottom: 16px;
        }
        ul, ol {
            margin-top: 0;
            margin-bottom: 16px;
            padding-left: 2em;
        }
        code {
            background-color: rgba(27, 31, 35, 0.05);
            border-radius: 3px;
            font-size: 85%;
            margin: 0;
            padding: 0.2em 0.4em;
            font-family: 'Courier New', Courier, monospace;
        }
        pre {
            background-color: #f6f8fa;
            border-radius: 6px;
            font-size: 85%;
            line-height: 1.45;
            overflow: auto;
            padding: 16px;
            margin-bottom: 16px;
        }
        pre code {
            background-color: transparent;
            border: 0;
            display: inline;
            line-height: inherit;
            margin: 0;
            overflow: visible;
            padding: 0;
            word-wrap: normal;
        }
        blockquote {
            border-left: 0.25em solid #dfe2e5;
            color: #6a737d;
            padding: 0 1em;
            margin: 0 0 16px 0;
        }
        table {
            border-collapse: collapse;
            border-spacing: 0;
            margin-bottom: 16px;
            width: 100%;
        }
        table tr {
            background-color: #fff;
            border-top: 1px solid #c6cbd1;
        }
        table th, table td {
            border: 1px solid #dfe2e5;
            padding: 6px 13px;
        }
        table th {
            font-weight: 600;
            background-color: #f6f8fa;
        }
        img {
            max-width: 100%;
        }
        a {
            color: #0366d6;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        hr {
            height: 0.25em;
            padding: 0;
            margin: 24px 0;
            background-color: #e1e4e8;
            border: 0;
        }
    </style>
</head>
<body>
${preview.innerHTML}
</body>
</html>`;
            
            const blob = new Blob([html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'markdown-export.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showToast('File exported successfully!');
        }

        // Back button
        function goBack() {
            window.history.back();
        }

        // Toast notification
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            
            toastMessage.textContent = message;
            
            // Set color based on type
            if (type === 'error') {
                toast.classList.remove('bg-gray-900');
                toast.classList.add('bg-red-600');
            } else {
                toast.classList.remove('bg-red-600');
                toast.classList.add('bg-gray-900');
            }
            
            // Show toast
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            
            // Hide after 3 seconds
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // Ctrl/Cmd + S to export
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                exportToFile();
            }
            
            // Ctrl/Cmd + Shift + C to copy
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'c') {
                e.preventDefault();
                copyToClipboard();
            }
        });
    </script>
</body>
</html>
